name: Build Windows Installer

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install npm dependencies
        run: npm install

      - name: Build Electron App
        run: npm run electron:build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ECO-Coffee-POS-Windows-Installer
          path: release/*.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
          name: Eco Coffee POS ${{ github.ref_name }}
          body: |
            ## Eco Coffee POS Windows Setup (.exe)
            
            1. `.exe` dosyasını indirin.
            2. POS bilgisayarınızda çift tıklayarak kurun.
            
            > **Not:** WebView2 veya ek runtime kurulumu gerekmez. Electron kendi Chromium tarayıcısını içerir.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
