name: Build Windows Installer

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install npm dependencies
        run: npm install

      - name: Build Frontend
        run: npm run build

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ECO-Coffee-POS-Windows-Installer
          path: src-tauri/target/release/bundle/nsis/*.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/nsis/*.exe
          name: Eco Coffee POS ${{ github.ref_name }}
          body: |
            ## Eco Coffee POS Windows Setup (.exe)
            
            1. `eco-coffee-pos_${{ github.ref_name }}_x64-setup.exe` dosyasını indirin.
            2. POS bilgisayarınızda çift tıklayarak kurun.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
