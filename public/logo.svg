<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <style>
    .txt-top { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 14px; fill: #34231b; }
    .txt-bot { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 11px; fill: #34231b; }
  </style>

  <!-- Background -->
  <circle cx="50" cy="50" r="49" fill="#F4EBE3" />
  
  <!-- E C O -->
  <text x="50" y="15" text-anchor="middle" dominant-baseline="middle" transform="rotate(-28, 50, 50)" class="txt-top">E</text>
  <text x="50" y="15" text-anchor="middle" dominant-baseline="middle" transform="rotate(0, 50, 50)" class="txt-top">C</text>
  <text x="50" y="15" text-anchor="middle" dominant-baseline="middle" transform="rotate(28, 50, 50)" class="txt-top">O</text>

  <!-- C O F F E E -->
  <text x="50" y="86" text-anchor="middle" dominant-baseline="middle" transform="rotate(40, 50, 50)" class="txt-bot">C</text>
  <text x="50" y="86" text-anchor="middle" dominant-baseline="middle" transform="rotate(24, 50, 50)" class="txt-bot">O</text>
  <text x="50" y="86" text-anchor="middle" dominant-baseline="middle" transform="rotate(8, 50, 50)" class="txt-bot">F</text>
  <text x="50" y="86" text-anchor="middle" dominant-baseline="middle" transform="rotate(-8, 50, 50)" class="txt-bot">F</text>
  <text x="50" y="86" text-anchor="middle" dominant-baseline="middle" transform="rotate(-24, 50, 50)" class="txt-bot">E</text>
  <text x="50" y="86" text-anchor="middle" dominant-baseline="middle" transform="rotate(-40, 50, 50)" class="txt-bot">E</text>

  <!-- Inner Circle -->
  <circle cx="50" cy="50" r="30" fill="none" stroke="#34231b" stroke-width="2.5" />
  
  <!-- Centered eco custom typography (scaled down slightly) -->
  <g transform="scale(0.75) translate(21.5, 17)">
    <g fill="none" stroke="#34231b" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" transform="translate(4, 0)">
      <!-- e -->
      <path d="M 36,52 c -5,0 -7,-3 -7,-6 c 0,-4 3,-5 6,-5 c 4,0 6,2 6,5 c 0,1 -1,2 -5,2 h -2" />
      <path d="M 32,50 h 7" />
      
      <!-- c -->
      <path d="M 55,45 c -2,-3 -6,-3 -8,0 c -2,2 -2,6 0,8 c 2,3 6,3 8,0" />
      
      <!-- o -->
      <path d="M 61,52 c -3,0 -5,-2 -5,-5 c 0,-3 2,-5 5,-5 c 3,0 5,2 5,5 c 0,3 -2,5 -5,5 z" />
      
      <!-- connector from e to c -->
      <path d="M 36,52 c 3,0 5,-2 7,-3 c 2,-1 3,-2 4,-4" />
      
      <!-- connector from c to o -->
      <path d="M 55,51 c 1,-1 2,-2 3,-3" />
    </g>
  </g>
</svg>
