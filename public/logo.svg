<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <style>
    .txt-top { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 11.5px; fill: #34231b; }
    .txt-bot { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 11px; fill: #34231b; }
  </style>

  <!-- Background -->
  <circle cx="50" cy="50" r="49" fill="#F4EBE3" />
  
  <!-- L E M O O N -->
  <text x="50" y="15" text-anchor="middle" dominant-baseline="middle" transform="rotate(-35, 50, 50)" class="txt-top">L</text>
  <text x="50" y="15" text-anchor="middle" dominant-baseline="middle" transform="rotate(-21, 50, 50)" class="txt-top">E</text>
  <text x="50" y="15" text-anchor="middle" dominant-baseline="middle" transform="rotate(-7, 50, 50)" class="txt-top">M</text>
  <text x="50" y="15" text-anchor="middle" dominant-baseline="middle" transform="rotate(7, 50, 50)" class="txt-top">O</text>
  <text x="50" y="15" text-anchor="middle" dominant-baseline="middle" transform="rotate(21, 50, 50)" class="txt-top">O</text>
  <text x="50" y="15" text-anchor="middle" dominant-baseline="middle" transform="rotate(35, 50, 50)" class="txt-top">N</text>

  <!-- K A F E -->
  <text x="50" y="86" text-anchor="middle" dominant-baseline="middle" transform="rotate(27, 50, 50)" class="txt-bot">K</text>
  <text x="50" y="86" text-anchor="middle" dominant-baseline="middle" transform="rotate(9, 50, 50)" class="txt-bot">A</text>
  <text x="50" y="86" text-anchor="middle" dominant-baseline="middle" transform="rotate(-9, 50, 50)" class="txt-bot">F</text>
  <text x="50" y="86" text-anchor="middle" dominant-baseline="middle" transform="rotate(-27, 50, 50)" class="txt-bot">E</text>

  <!-- Inner Circle -->
  <circle cx="50" cy="50" r="30" fill="none" stroke="#34231b" stroke-width="2.5" />
  
  <!-- Centered Coffee Cup Motif -->
  <g stroke="#34231b" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Steam lines -->
    <path d="M 45 36 c 0 -2 1.5 -3 0 -5" stroke-width="1.8" />
    <path d="M 50 36 c 0 -2 1.5 -3 0 -5" stroke-width="1.8" />
    <path d="M 55 36 c 0 -2 1.5 -3 0 -5" stroke-width="1.8" />

    <!-- Cup Body -->
    <path d="M 40 41 h 20 v 11 a 10 10 0 0 1 -20 0 z" stroke-width="2.4" fill="#34231b" fill-opacity="0.08" />

    <!-- Cup Handle -->
    <path d="M 60 43 h 3.5 a 3.5 3.5 0 0 1 0 7 h -3.5" stroke-width="2.2" />

    <!-- Cup Saucer -->
    <path d="M 36 57 h 28" stroke-width="2.4" />
  </g>
</svg>
