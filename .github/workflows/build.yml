name: Build Windows Installer

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install npm dependencies
        run: npm install

      - name: Copy existing database (migration)
        run: |
          if (Test-Path "backend/eco_coffee.db") {
            Copy-Item "backend/eco_coffee.db" "src-tauri/"
          }
        shell: pwsh

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'Eco Coffee POS v__VERSION__'
          releaseBody: |
            ## Eco Coffee POS Güncellemesi
            
            Bu sürümdeki değişiklikler için commit geçmişini inceleyiniz.
            
            ### Kurulum
            1. `Eco.Coffee.POS_1.0.0_x64-setup.exe` dosyasını indirin
            2. Çift tıklayarak kurun
            3. Kurulum tamamlandığında uygulama otomatik başlayacaktır
          releaseDraft: false
          prerelease: false

      - name: Report build size
        run: |
          $exeFiles = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue
          if ($exeFiles) {
            foreach ($file in $exeFiles) {
              $sizeMB = [math]::Round($file.Length / 1MB, 2)
              Write-Host "📦 Installer: $($file.Name) — $sizeMB MB"
            }
          } else {
            Write-Host "⚠️ No .exe found in bundle output"
          }
          
          # Also check the unpacked app size
          $appDir = "src-tauri/target/release"
          if (Test-Path "$appDir/eco-coffee-pos.exe") {
            $appSize = [math]::Round((Get-Item "$appDir/eco-coffee-pos.exe").Length / 1MB, 2)
            Write-Host "🖥️ App binary: $appSize MB"
          }
        shell: pwsh
